services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: checkmate-api-app
    restart: unless-stopped
    ports:
      - "8000:8000"
      - "5174:5173"
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: http://localhost:8000
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: checkmate_api
      DB_USERNAME: checkmate
      DB_PASSWORD: checkmate
      SESSION_DRIVER: file
      CACHE_STORE: database
      QUEUE_CONNECTION: database
      VITE_HOST: 0.0.0.0
    volumes:
      - .:/var/www/html
      - ./.env.docker:/var/www/html/.env
      - vendor:/var/www/html/vendor
      - node_modules:/var/www/html/node_modules
    depends_on:
      mysql:
        condition: service_healthy

  mysql:
    image: mysql:8.4
    container_name: checkmate-api-mysql
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      MYSQL_DATABASE: checkmate_api
      MYSQL_USER: checkmate
      MYSQL_PASSWORD: checkmate
      MYSQL_ROOT_PASSWORD: root
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  mysql_data:
  vendor:
  node_modules:
